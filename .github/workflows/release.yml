# Every merge to main publishes a new release (and the Android app is attached to it). The server itself updates from main (scripts/update.sh), so there is nothing else to package. Nothing to tag by hand.
# The version is the year, the month and a counter: v2026.10.0, v2026.10.1, ... (the counter restarts each month).
# Documentation-only changes do not release. "Run workflow" in the Actions tab releases the current main on demand.
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Work out the next version
        id: next
        run: |
          prefix="v$(date -u +%Y.%-m)."
          last=$(git tag -l "${prefix}*" | sed "s/^${prefix}//" | sort -n | tail -1)
          tag="${prefix}$(( ${last:--1} + 1 ))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
      - name: Create the release (this also creates the tag)
        run: gh release create "${{ steps.next.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${{ steps.next.outputs.tag }}" --generate-notes
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the APK
        run: |
          TAG='${{ needs.release.outputs.tag }}'
          VERSION="${TAG#v}"
          gradle -p apps/android :app:assembleRelease -PappVersion="$VERSION"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "turbokeep-$VERSION-android.apk"
          gh release upload "$TAG" "turbokeep-$VERSION-android.apk" --clobber
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
