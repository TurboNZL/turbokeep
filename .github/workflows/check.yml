# Checks on every push to main only (other branches are not built): typecheck and tests for both packages, and the builds (server bundle and web client).
name: Check
on:
  push:
    branches: [main]
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @turbokeep/server exec tsc --noEmit
      - run: pnpm --filter @turbokeep/server test
      - run: pnpm --filter @turbokeep/web exec tsc --noEmit
      - run: pnpm --filter @turbokeep/web test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug
