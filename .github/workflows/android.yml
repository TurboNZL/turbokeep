# Builds the Android app (unit tests and a debug APK) on every push to a branch other than main, so a change to apps/android is compiled before it is merged.
# (check.yml only runs on main, and pull requests opened by auto-pr.yml do not start workflows.) The APK is kept as a run artifact for a quick install.
name: Android
on:
  push:
    branches-ignore: [main]
    paths: ['apps/android/**', 'apps/web/**', 'branding/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # the app bundles the web client (apps/web/dist) and shows it from http://localhost, so it is built first
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @turbokeep/web build
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: turbokeep-debug-apk, path: apps/android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 7 }
