<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- The tab icon is the coloured centre symbol alone (scripts/gen-icons.mjs: symbolPng), as PNGs of 32 and 48 px ONLY. Do not add the symbol as an SVG here: an SVG
         `<link rel="icon">` counts as "any size", so browsers use it for everything that wants a large icon too (the installed app's window and taskbar icon).
         The full emblem is offered at 192 px for those, and the manifest lists the full emblem. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TurboKeep</title>
    <!-- The plain Home requests start now, not after the page code has downloaded and run (src/lib/early.ts uses them). -->
    <script>
      (function () {
        var p = location.pathname;
        // inside the Android app the page is bundled and the server is another address with a token: the page code asks by itself
        if (window.TurboKeepAndroid || (p !== '/' && p.indexOf('/home') !== 0) || location.search) return;
        function get(u) { return fetch(u, { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }); }
        var e = (window.__early = { notes: get('/api/notes?excerpt=1&list=1'), tags: get('/api/tags'), me: get('/api/auth/me') });
        for (var k in e) e[k].catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
